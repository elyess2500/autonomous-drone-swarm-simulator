[pytest]
testpaths = tests
python_files = *_tests.py gameplay_smoke.py
python_functions = test_*
addopts = --strict-config --strict-markers
markers =
    fast: inexpensive correctness contracts; developer feedback
    standard: broader integration or graphical checks; combine with fast for normal CI
    heavy: long gameplay/integration validation; opt-in or scheduled CI
    graphical: requires presentation/font/surface/display infrastructure
    deterministic: protects seeded state, RNG, configuration or presentation independence
